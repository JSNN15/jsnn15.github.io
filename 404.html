        vigia: 'ppe_detection_computer_vision_2026',
        'selector-fruta': 'fruit_sorting_computer_vision_2026',
      };
      var partes = location.pathname.split('/');
      if (NUEVO[partes[1]]) {
        partes[1] = NUEVO[partes[1]];
        location.replace(partes.join('/') + location.search + location.hash);
      }
